# Deploys the site to DreamHost (rsync over SSH, never FTP) every time main is pushed, or when you press Run workflow.
# Secrets (repo > Settings > Secrets and variables > Actions): DH_SSH_PRIVATE_KEY, DH_HOST, DH_USER, DH_PATH.
# DH_PATH is the project folder on the server, e.g. /home/cashiers/prurientinterests.me. The website's web directory
# in the DreamHost panel must be that folder plus /public.
name: Deploy to DreamHost

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the settings before touching the server
        env:
          DH_HOST: ${{ secrets.DH_HOST }}
          DH_USER: ${{ secrets.DH_USER }}
          DH_PATH: ${{ secrets.DH_PATH }}
          DH_KEY: ${{ secrets.DH_SSH_PRIVATE_KEY }}
        run: |
          for v in DH_HOST DH_USER DH_PATH DH_KEY; do
            if [ -z "${!v}" ]; then echo "::error::The GitHub secret for $v is missing. Add it under Settings > Secrets and variables > Actions."; exit 1; fi
          done
          # rsync --delete empties whatever folder it targets, so the target must be ONE dedicated folder for this site.
          if ! printf '%s' "$DH_PATH" | grep -Eq '^/home/[a-z0-9_]+/[A-Za-z0-9._-]+$'; then
            echo "::error::DH_PATH must look like /home/USER/FOLDER (one folder inside the home folder). Got: $DH_PATH"; exit 1
          fi
          if ! printf '%s' "$DH_PATH" | grep -qi 'prurient'; then
            echo "::error::DH_PATH must contain 'prurient' so this site can never overwrite another site's folder. Got: $DH_PATH"; exit 1
          fi
          echo "Deploying to $DH_USER@$DH_HOST:$DH_PATH"

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DH_SSH_PRIVATE_KEY }}

      - name: Trust the DreamHost host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DH_HOST }}" >> ~/.ssh/known_hosts

      - name: Make sure the folder exists
        run: ssh "${{ secrets.DH_USER }}@${{ secrets.DH_HOST }}" "mkdir -p '${{ secrets.DH_PATH }}'"

      - name: Sync files to the server
        run: |
          rsync -az --delete \
            --exclude '.git/' --exclude '.github/' --exclude 'docs/' \
            --exclude '.env' --exclude 'vendor/' \
            --exclude 'storage/logs/*' --exclude 'storage/cache/*' --exclude 'storage/sessions/*' \
            --exclude 'storage/secrets/*' --exclude 'storage/import/*' --exclude 'storage/reports/*' \
            --exclude 'public/uploads/' \
            ./ "${{ secrets.DH_USER }}@${{ secrets.DH_HOST }}:${{ secrets.DH_PATH }}/"

      - name: Install dependencies and run database migrations
        run: |
          ssh "${{ secrets.DH_USER }}@${{ secrets.DH_HOST }}" "bash -s" <<'REMOTE'
          set -e
          cd '${{ secrets.DH_PATH }}'
          # The website runs PHP 8.3 but DreamHost's plain `php` command is older, so use the 8.3 program explicitly.
          PHP=""
          for c in /usr/local/php84/bin/php /usr/local/php83/bin/php; do [ -x "$c" ] && PHP="$c" && break; done
          [ -n "$PHP" ] || { echo "PHP 8.3 was not found on the server"; exit 1; }
          echo "Using $($PHP -v | head -1)"
          mkdir -p storage/logs storage/cache storage/sessions storage/import storage/reports public/uploads
          # Composer (PHP's package installer): download once, check its fingerprint, keep it inside this project.
          if [ ! -f storage/cache/composer.phar ]; then
            curl -fsSL https://getcomposer.org/download/latest-stable/composer.phar -o storage/cache/composer.phar
            curl -fsSL https://getcomposer.org/download/latest-stable/composer.phar.sha256sum -o storage/cache/composer.phar.sha256sum
            (cd storage/cache && sha256sum -c composer.phar.sha256sum)
          fi
          $PHP storage/cache/composer.phar install --no-dev --optimize-autoloader --no-interaction
          if [ -f .env ]; then $PHP bin/migrate.php; else echo "No .env yet: skipping migrations. Run the Server task called write-env first."; fi
          echo "deployed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          REMOTE
